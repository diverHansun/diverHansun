    <style>
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans  { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-style: italic; }

      .in { animation: rise 1s cubic-bezier(.2,.7,.2,1) both; }
      .a1 { animation-delay: .1s; } .a2 { animation-delay: .3s; } .a3 { animation-delay: .5s; } .a4 { animation-delay: .7s; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      /* the wash breathes very slowly */
      .d1 { animation: d1 18s ease-in-out infinite; }
      .d2 { animation: d2 22s ease-in-out infinite; }
      .d3 { animation: d3 26s ease-in-out infinite; }
      @keyframes d1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-28px,10px); } }
      @keyframes d2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,-8px); } }
      @keyframes d3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-18px,-12px); } }

      .tw { animation: tw 5s ease-in-out infinite; }
      .t2 { animation-delay: -1.25s; } .t3 { animation-delay: -2.5s; } .t4 { animation-delay: -3.75s; }
      @keyframes tw { 0%,100% { opacity: 1; } 50% { opacity: .15; } }

      .sheen { animation: sheen 10s ease-in-out infinite; }
      @keyframes sheen { 0%,60% { transform: translateX(-280px); } 100% { transform: translateX(920px); } }

      @media (prefers-reduced-motion: reduce) {
        .in, .cursor, .d1, .d2, .d3, .tw, .sheen { animation: none; }
      }
    </style>
  </defs>

