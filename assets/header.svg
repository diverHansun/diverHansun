    <!-- frosted haze behind the text: no plate, no border — it simply
         dissolves back into the painting toward the right -->
    <g mask="url(#haze)">
      <rect width="1200" height="300" fill="#faf9f5"/>
      <use href="#painting" filter="url(#frost)"/>
      <rect width="1200" height="300" fill="url(#glass)"/>
      <g transform="skewX(-18)"><rect class="sheen" x="-80" y="0" width="180" height="300" fill="url(#sheen)"/></g>
    </g>

    <!-- identity -->
    <text class="mono in a1" x="84" y="92" font-size="14" fill="#6c6a64">~/diverHansun <tspan fill="#b5afa3">$</tspan> whoami</text>
    <text class="in a2" x="81" y="160" font-size="58" letter-spacing="-1.4">
      <tspan class="serif" fill="#2f6f73">Hi! I'm </tspan><tspan class="sans" fill="#1d1d1f" font-weight="600">@diverHansun</tspan>
    </text>
    <rect class="in a3" x="84" y="183" width="64" height="2.5" rx="1.25" fill="url(#rule)"/>
    <text class="mono in a4" x="84" y="224" font-size="17" fill="#3d3d3a">Building AI <tspan fill="#c9c3b6">|</tspan> Full-Stack <tspan fill="#c9c3b6">|</tspan> Hardware<tspan class="cursor" fill="#f08a5d"> ▍</tspan></text>

    <!-- faint canvas grain -->
    <rect width="1200" height="300" filter="url(#grain)" opacity="0.22"/>
