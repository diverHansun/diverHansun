<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Hi! I'm @diverHansun — Building AI | Full-Stack | Hardware">
  <!--
    "Un dimanche après-midi" — light impressionist haze banner (generated by assets/src/gen_header.py)
    canvas #faf9f5 · ink #1d1d1f · teal #2f6f73 · apricot #f08a5d
  -->
  <defs>
    <filter id="wash" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <!-- light oil: wobble stroke edges like a loaded brush -->
    <filter id="oil" x="-5%" y="-40%" width="110%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.09" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.8"/>
    </filter>
    <filter id="dab" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.3" numOctaves="1" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.7" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.40  0 0 0 0 0.32  0 0 0 0.8 -0.34"/>
    </filter>
    <filter id="frost" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.36"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f08a5d"/>
      <stop offset="0.5" stop-color="#f2d58a"/>
      <stop offset="1" stop-color="#7fb6d5"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="card"><rect width="1200" height="300" rx="20"/></clipPath>
    <linearGradient id="hazeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.42" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.66" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="haze" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="300">
      <rect width="1200" height="300" fill="url(#hazeFade)"/>
    </mask>

